    bool isGestureShake() {
        return (( _uBit.accelerometer.getGesture() == MICROBIT_ACCELEROMETER_EVT_SHAKE) 
            || ( _uBit.accelerometer.getX() > 1800 ) 
            || ( _uBit.accelerometer.getY() > 1800 ) 
            || ( _uBit.accelerometer.getZ() > 1800 ));            
    }

ULTRASONIC_GET_DISTANCE:
  PYTHON: |
    def measure_distance_cm(echo=calliopemini.pin_A1_RX, trigger=calliopemini.pin_A1_RX):
        trigger.write_digital(1)
        trigger.write_digital(0) 
        msec = time_pulse_us(echo, 1)
        echo_time = msec / 1000000
        dist_cm = (echo_time / 2) * 34300
        return dist_cm 

LED_BAR_SET_LED:
  PYTHON: |
    def write16(di, dcki, data):
        state = dcki.read_digital()
        for i in range(15,-1,-1):
          di.write_digital((data >> i) & 1)
          state = not state
          dcki.write_digital(state)
    
    def set_led(led_no, brightness):
        di = calliopemini.pin_A1_RX
        dcki = calliopemini.pin_A1_TX
        di.write_digital(0)
        dcki.write_digital(0)
        if led_no < 0 or led_no >= 10:
            raise ValueError("Led_no must be in the range [0, 9]")
    
        val = 1 << led_no
        write16(di, dcki, 0)
        for i in range(10):
            write16(di, dcki, brightness if (val >> i) & 1 else 0)
    
        write16(di, dcki,0)
        write16(di, dcki,0)
        di.write_digital(0)
        calliopemini.sleep(1)
        for i in range(4):
            di.write_digital(1)
            di.write_digital(0)
        calliopemini.sleep(1)


SET_MATRIX_BRIGHTNESS:
  PYTHON: |
    def set_brightness(val):
        global brightness
        if val < 0 or val >= 10:
            raise ValueError("Brightness must be in the range [0, 9]")
        for y in range(5):
            for x in range(5):
                calliopemini.display.set_pixel(x,y,val)
        brightness = val

SET_BOTH_MOTORS:
  PYTHON: |
    def set_both_motors(speed_A, speed_B):
        digit_0 = 0
        digit_1 = 0
        if (speed_A < 0):
            digit_0 = 1
            speed_A *= -1
        if (speed_B < 0):
            digit_1 = 1
            speed_B *= -1
        speed_A = int(speed_A * 10.23)
        speed_B = int(speed_B * 10.23)
        calliopemini.pin_M_MODE.write_digital(1)
        calliopemini.pin_M0_DIR.write_digital(digit_0)
        calliopemini.pin_M1_DIR.write_digital(digit_1)
        calliopemini.pin_M0_SPEED.write_analog(speed_A)
        calliopemini.pin_M1_SPEED.write_analog(speed_B)

SET_MOTOR:
  PYTHON: |
    def set_motor(port, speed):
        digit = 0
        if (speed < 0):
            digit = 1
            speed *= -1
        speed = int(speed * 10.23)
        calliopemini.pin_M_MODE.write_digital(1)
        if (port == "A"):
            calliopemini.pin_M0_DIR.write_digital(digit)
            calliopemini.pin_M0_SPEED.write_analog(speed)
        else:
            calliopemini.pin_M1_DIR.write_digital(digit)
            calliopemini.pin_M1_SPEED.write_analog(speed)

SERVO_GET_ANGLE:
  PYTHON: |
    def servo_get_angle(angle):
        if (angle < 0): 
            angle = 0
        if (angle > 180): 
            angle = 180
        return round(0.55 * angle) + 25

RECEIVE_MESSAGE:
  PYTHON: |
    def receive_message(type):
        global rssi
        details = radio.receive_full()
        if details:
            msg, rssi, timestamp = details
            msg = msg.decode('utf-8')[3:]
            if type == "Number":
                try:
                    digit = float(msg)
                except ValueError:
                    digit = 0
                return digit
            elif type == "Boolean":
                return msg == 'True' or msg == '1'     
            elif type == "String":
                return msg
        else:
            if type == "Number":
                return 0
            elif type == "Boolean":
                return False       
            elif type == "String":
                return ''


GET_ROTATION:
  PYTHON: |
    def get_Rotation(dim):
        x = -calliopemini.accelerometer.get_y()
        y = calliopemini.accelerometer.get_x()
        z = -calliopemini.accelerometer.get_z()
        roll = math.atan2(y, z)
        if (dim == "roll"):
            return math.floor((-360*roll)/(2*math.pi))
        elif (dim == "pitch"):
            factor = y * math.sin(roll) + z * math.cos(roll)
            if factor != 0:
                pitch = math.atan(-x / (factor))            
                return math.floor((360*pitch)/(2*math.pi))

SCD40_GET_SAMPLE:
  PYTHON: |
    def scd40_get_sample(mode):
        global _scd40_i2c_initialized, _scd40_started, _scd40_values
        try:
            _scd40_started
        except NameError:
            _scd40_i2c_initialized = False
            _scd40_started = False
            _scd40_values = (0, 0, 0)

        def scd40_crc(data):
            crc = 0xff
            for byte in data:
                crc ^= byte
                for _ in range(8):
                    if crc & 0x80:
                        crc = ((crc << 1) ^ 0x31) & 0xff
                    else:
                        crc = (crc << 1) & 0xff
            return crc

        if not _scd40_i2c_initialized:
            try:
                if hasattr(calliopemini, "pin_A0_SCL") and hasattr(calliopemini, "pin_A0_SDA"):
                    calliopemini.i2c.init(freq=400000, scl=calliopemini.pin_A0_SCL, sda=calliopemini.pin_A0_SDA)
                elif hasattr(calliopemini, "pin_C19") and hasattr(calliopemini, "pin_C20"):
                    calliopemini.i2c.init(freq=400000, scl=calliopemini.pin_C19, sda=calliopemini.pin_C20)
            except Exception:
                pass
            _scd40_i2c_initialized = True

        try:
            if not _scd40_started:
                calliopemini.i2c.write(0x62, b'\x21\xb1')
                calliopemini.sleep(5000)
                _scd40_started = True

            calliopemini.i2c.write(0x62, b'\xec\x05')
            calliopemini.sleep(1)
            data = calliopemini.i2c.read(0x62, 9)
        except Exception:
            return _scd40_values[mode]

        if len(data) >= 9 and scd40_crc(data[0:2]) == data[2] and scd40_crc(data[3:5]) == data[5] and scd40_crc(data[6:8]) == data[8]:
            co2 = (data[0] << 8) | data[1]
            raw_temperature = (data[3] << 8) | data[4]
            raw_humidity = (data[6] << 8) | data[7]
            _scd40_values = (co2, -45 + 175 * raw_temperature / 65535, 100 * raw_humidity / 65535)

        return _scd40_values[mode]
  C: |
    double scd40_get_sample(int mode) {
        static bool started = false;
        static double values[3] = { 0, 0, 0 };
        const int address = 0x62 << 1;
        if ( !started ) {
            char startCommand[2] = { 0x21, (char) 0xb1 };
            _i2c.write(address, startCommand, 2);
            _uBit.sleep(5000);
            started = true;
        }

        char readCommand[2] = { (char) 0xec, 0x05 };
        char data[9] = { 0, 0, 0, 0, 0, 0, 0, 0, 0 };
        _i2c.write(address, readCommand, 2);
        _uBit.sleep(1);
        if ( _i2c.read(address, data, 9) == 0 ) {
            bool crcValid = true;
            for ( int word = 0; word < 3; word++ ) {
                uint8_t crc = 0xff;
                for ( int i = 0; i < 2; i++ ) {
                    crc ^= (uint8_t) data[word * 3 + i];
                    for ( int bit = 0; bit < 8; bit++ ) {
                        if ( crc & 0x80 ) {
                            crc = (uint8_t) ((crc << 1) ^ 0x31);
                        } else {
                            crc = (uint8_t) (crc << 1);
                        }
                    }
                }
                if ( crc != (uint8_t) data[word * 3 + 2] ) {
                    crcValid = false;
                }
            }
            if ( crcValid ) {
                uint16_t co2 = ((uint8_t) data[0] << 8) | (uint8_t) data[1];
                uint16_t rawTemperature = ((uint8_t) data[3] << 8) | (uint8_t) data[4];
                uint16_t rawHumidity = ((uint8_t) data[6] << 8) | (uint8_t) data[7];
                values[0] = co2;
                values[1] = -45.0 + 175.0 * rawTemperature / 65535.0;
                values[2] = 100.0 * rawHumidity / 65535.0;
            }
        }
        return values[mode];
    }
